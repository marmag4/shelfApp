# --- Server ---
server.port=8080

# --- Database connection (matches docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/shelfapp
spring.datasource.username=shelfapp_user
spring.datasource.password=shelfapp_pass

# We already created the tables ourselves with schema.sql (DB-first approach),
# so Hibernate must never try to create/alter them on its own.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (login tokens) ---
# Random secret used to sign/verify tokens. Fine to keep in this file for a
# student project; in a "real" production app this would come from an
# environment variable instead of being committed to git.
jwt.secret=86xU4OiT6TxkA5tyXx3rzCKKP4BUxq_tQhNlZcHaW3uEkkLE4XucvTNa9kf_O_H8NVnU7weVxmILocuPF73CFA
# 24 hours, in milliseconds
jwt.expiration-ms=86400000
