# --- Server ---
server.port=8080

# --- Database connection (matches docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/shelfapp
spring.datasource.username=shelfapp_user
spring.datasource.password=shelfapp_pass

# We already created the tables ourselves with schema.sql (DB-first approach),
# so Hibernate must never try to create/alter them on its own.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
